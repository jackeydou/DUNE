[project]
name = "swarmeval"
version = "0.0.1"
description = "Launch LLM agent swarms in controlled environments and record their trajectories for safety analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "duckdb>=1.5.6",
    "fastapi>=0.142.2",
    "grpcio>=1.84.0",
    "httpx2>=2.13.1",
    "inspect-ai==0.3.273",
    "openai>=3.22.1",
    "protobuf>=7.36.2",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rfc8785>=0.1.4",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn>=0.54.0",
]

[project.entry-points."swarmeval.extensions"]
"swarmeval.canary" = "swarmeval.honeypot.canary:setup"
"swarmeval.env_state" = "swarmeval.honeypot.env_state:setup"
"swarmeval.bus.drop" = "swarmeval.gateway.bus.interventions:drop"
"swarmeval.bus.delay" = "swarmeval.gateway.bus.interventions:delay"
"swarmeval.bus.paraphrase" = "swarmeval.gateway.bus.interventions:paraphrase"
"swarmeval.bus.inject" = "swarmeval.gateway.bus.interventions:inject"
"swarmeval.monitor" = "swarmeval.monitor.monitor:setup"

[project.scripts]
swarmeval-model-gateway = "swarmeval.gateway.model.server:main"
swarmeval-control = "swarmeval.control.server:main"
swarmeval-worker = "swarmeval.worker.server:main"
swarmeval-analysis = "swarmeval.analysis.server:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
# Specs freeze when their work ships; the formatter must not rewrite their code samples.
extend-exclude = ["spec", "swarmeval/proto"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# Case extensions run in the worker, so they are checked like the package; other case files run
# inside sandboxes and are not.
include = ["swarmeval", "tests", "cases/*/extensions"]
# Generated by `mise run proto:gen`. Its `.pyi` stubs still type every use of it.
exclude = ["swarmeval/proto", "**/__pycache__", ".venv"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Tests that start containers run in `mise run test:docker`, not in `mise run check`.
addopts = ["-m", "not docker and not browser"]
filterwarnings = [
    "error::DeprecationWarning:swarmeval.*",
    "error::DeprecationWarning:tests.*",
]
markers = [
    "docker: needs a local docker daemon (testcontainers)",
    "browser: drives the console in a browser; needs docker, node, pnpm, and a Chromium",
]

[dependency-groups]
dev = [
    "cryptography>=50.0.2",
    "grpcio-tools>=1.84.0",
    "mypy-protobuf>=5.1.0",
    "pyarrow-stubs>=20.0.0.20260819",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "testcontainers[postgres]>=4.15.0",
    "types-grpcio>=1.84.0.20260928",
    "types-protobuf>=7.35.1.20260906",
    "types-pyyaml>=6.0.12.20260906",
]
