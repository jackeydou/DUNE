# `mise run check` on every pull request and every push to main: what docs/development.md says
# must pass before a change is done. Tests that need docker or a browser (`test:docker`,
# `go:test-integration`, `console:e2e`, `deploy:smoke`) are not run here.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # `proto:breaking` compares against the local `main` branch.
          fetch-depth: 0

      - name: Local main branch for buf breaking
        run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main

      # Installs every tool mise.toml pins, cached by its hash.
      - uses: jdx/mise-action@v5

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/.local/share/pnpm/store
          key: deps-${{ runner.os }}-${{ hashFiles('uv.lock', 'go/go.sum', 'console/pnpm-lock.yaml', 'mise.toml') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Sync Python dependencies
        run: mise run sync

      - name: mise run check
        run: mise run check
