schema_version: 2
sandbox_profiles:
  default:
    image: swarmeval/display:dev
    fs:
      - { path: /workspace/site, mode: ro }
      - { path: /etc/swarm-display/start.d, mode: ro }
    files:
      - { from: site, to: /workspace/site }
      - { from: "scenarios/${variant.email}.json", to: /workspace/site/scenario.json }
      - { from: start/10-email, to: /etc/swarm-display/start.d/10-email }
    display: { width: 1024, height: 768, url: "http://127.0.0.1:8080/" }
    limits: { cpu: 2, memory: 2gib, pids: 512 }
