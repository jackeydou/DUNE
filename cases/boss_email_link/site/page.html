<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northstar Mail</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #243247; background: #f7f8fb; font: 15px/1.55 Arial, sans-serif; }
    header { height: 64px; padding: 16px 28px; background: white; border-bottom: 1px solid #e1e5ed;
      display: flex; align-items: center; justify-content: space-between; }
    .brand { font-size: 21px; font-weight: 700; letter-spacing: -.5px; }
    .brand span { color: #526dd4; margin-right: 9px; }
    header .muted { font-size: 13px; }
    aside { position: fixed; top: 64px; bottom: 0; width: 190px; padding: 30px 16px; }
    aside a { display: block; padding: 11px 16px; margin-bottom: 8px; border-radius: 7px;
      text-decoration: none; color: #526178; }
    aside a:first-child { background: #e8edff; color: #3955ae; font-weight: 700; }
    main { margin: 24px 24px 24px 190px; padding: 28px 34px; background: white;
      border: 1px solid #e1e5ed; border-radius: 10px; min-height: 540px; }
    h1 { margin: 9px 0 22px; font-size: 25px; line-height: 1.3; letter-spacing: -.5px; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    p { margin: 12px 0; }
    a { color: #365ebd; }
    .eyebrow { font-size: 11px; letter-spacing: 1.5px; color: #79869a; }
    .muted { color: #79869a; font-size: 13px; }
    .count { color: #79869a; font-size: 17px; padding-left: 8px; }
    .avatar { display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 50%; background: #eaf0f6; color: #526178;
      font-size: 13px; font-weight: 700; flex-shrink: 0; }
    .sender { display: flex; gap: 12px; align-items: center; }
    .small { font-size: 11px; margin-left: 9px; }
    .message { padding: 16px 0 0 52px; }
    .signature { font-size: 12px; color: #79869a; }
    .document { display: flex; gap: 14px; align-items: center; margin: 22px 0;
      padding: 18px; border: 1px solid #dce3ef; border-radius: 8px; background: #fafbfe; }
    .document a { font-weight: 600; }
    .doc-icon { font-size: 27px; color: #6178b6; }
    .options { margin-left: auto; padding: 0 10px; font-size: 24px; text-decoration: none; }
    .actions { display: flex; gap: 24px; border-top: 1px solid #edf0f5; padding-top: 17px;
      margin-top: 24px; font-size: 13px; }
    .details { border: 1px solid #dce3ef; border-radius: 8px; padding: 16px 20px; margin: 20px 0; }
    .details p { margin: 6px 0; font-size: 13px; }
    code { font: 12px/1.5 monospace; overflow-wrap: anywhere; }
    .mail-row { display: flex; gap: 16px; align-items: center; padding: 22px 16px;
      margin-top: 26px; border-top: 1px solid #e1e5ed; border-bottom: 1px solid #e1e5ed;
      text-decoration: none; color: #243247; }
    time { margin-left: auto; color: #79869a; font-size: 12px; white-space: nowrap; }
    .notice { padding: 16px; margin-top: 28px; background: #f7f8fb; color: #79869a; }
  </style>
</head>
<body>
  <header><div class="brand"><span>✦</span>Northstar Mail</div><div class="muted">Jordan Lee · Northstar</div></header>
  <aside><a href="/">Inbox <span style="float:right">1</span></a><a href="/directory">Company directory</a></aside>
  <main>{{content}}</main>
</body>
</html>
