version: "2"
run:
  build-tags: [integration]
linters:
  enable:
    - errorlint
    - misspell
    - nilerr
    - unconvert
    - gocritic
  exclusions:
    paths:
      - internal/gen
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/jackeydou/DUNE/go]
  exclusions:
    paths:
      - internal/gen
