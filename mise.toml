[tools]
uv = "0.10.5"
go = "1.27.1"
golangci-lint = "2.14.0"
buf = "1.73.0"
node = "24"
pnpm = "11.24.0"
protoc-gen-go = "1.36.12"
protoc-gen-go-grpc = "1.6.2"
"go:connectrpc.com/connect/cmd/protoc-gen-connect-go" = "1.21.0"

[tasks.sync]
description = "Install the Python version and all dependencies from uv.lock"
run = "uv sync --locked"

[tasks.fmt]
description = "Format all Python, Go, and proto files in place"
run = ["uv run ruff format .", "cd go && golangci-lint fmt ./...", "buf format -w"]

[tasks.lint]
description = "Check formatting and lint rules"
run = ["uv run ruff format --check .", "uv run ruff check ."]

[tasks.typecheck]
description = "Run pyright in strict mode"
run = "uv run pyright"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks."test:docker"]
description = "Python tests that start containers (Postgres via testcontainers). Needs docker"
run = "uv run pytest -m docker"

[tasks."go:lint"]
description = "golangci-lint over the Go module, integration tests included"
dir = "go"
run = "golangci-lint run ./..."

[tasks."go:test"]
description = "Go unit tests"
dir = "go"
run = "go test ./..."

[tasks."go:test-integration"]
description = "sandboxd against the local docker daemon (needs busybox:latest and python:3.12-slim on the host), and edge against a throwaway Postgres"
dir = "go"
run = "go test -tags integration -count=1 ./..."

[tasks."display:build"]
description = "Build swarmeval/display:dev, the sandbox image for the browser and computer tools. Downloads Debian packages and Chromium"
run = "docker build -f deploy/images/display/Dockerfile -t swarmeval/display:dev deploy/images/display"

[tasks."deploy:smoke"]
description = "The compose stack with a recorded model backend: a case created, run, and read through the CLI and the API. Needs docker"
run = "deploy/compose/smoke.sh"

[tasks."console:install"]
description = "Install the console's dependencies from pnpm-lock.yaml"
dir = "console"
run = "pnpm install --frozen-lockfile"

[tasks."console:check"]
description = "The console's typecheck, lint, and unit tests"
dir = "console"
depends = ["console:install"]
run = ["pnpm typecheck", "pnpm lint", "pnpm test"]

[tasks."console:build"]
description = "Build the console into go/internal/edge/webui/static, where edge embeds it from. Build edge after it"
dir = "console"
depends = ["console:install"]
run = "pnpm build"

[tasks."console:e2e"]
description = "Playwright walks the console's threshold flow against a local stack. Needs docker and a Chromium (Playwright's own, or PLAYWRIGHT_CHROMIUM)"
depends = ["console:install"]
run = "uv run pytest -m browser"

[tasks."intake:install"]
description = "Install the intake Worker's dependencies from pnpm-lock.yaml"
dir = "intake"
run = "pnpm install --frozen-lockfile"

[tasks."intake:check"]
description = "The intake Worker's typecheck, lint, and unit tests"
dir = "intake"
depends = ["intake:install"]
run = ["pnpm typecheck", "pnpm lint", "pnpm test"]

[tasks."intake:test-integration"]
description = "The intake Worker in workerd against a throwaway Postgres (testcontainers). Needs docker"
dir = "intake"
depends = ["intake:install"]
run = "pnpm test:integration"

[tasks."intake:build"]
description = "Build the intake pages (console/src/intake/) into intake/public, which the Worker serves"
dir = "console"
depends = ["console:install"]
run = "pnpm build:intake"

[tasks."intake:dev"]
description = "The intake Worker on http://127.0.0.1:8787 with wrangler dev; needs intake/.dev.vars and a local Postgres (docs/services/intake.md)"
dir = "intake"
depends = ["intake:install", "intake:build"]
run = "pnpm dev"

[tasks."intake:migrate"]
description = "Apply intake/migrations to $INTAKE_MIGRATE_URL with goose, as `intake_owner` (intake/setup.sql makes the role and the schema)"
run = "go run github.com/pressly/goose/v3/cmd/goose@v3.28.0 -dir intake/migrations -table intake.goose_db_version postgres \"$INTAKE_MIGRATE_URL\" up"

[tasks."intake:deploy"]
description = "Build the pages and deploy the intake Worker with wrangler. Needs Cloudflare credentials"
dir = "intake"
depends = ["intake:install", "intake:build"]
run = "pnpm run deploy"

[tasks."proto:gen"]
description = "Generate gRPC stubs from proto/: Go with buf, Python with grpcio-tools, the console's and the intake Worker's TypeScript with protoc-gen-es"
depends = ["console:install", "intake:install"]
run = [
  "buf generate",
  "buf generate --template console/buf.gen.yaml --path proto/swarmeval/api --path proto/swarmeval/intake",
  "buf generate --template intake/buf.gen.yaml --path proto/swarmeval/intake",
  "rm -rf swarmeval/proto && uv run python -m grpc_tools.protoc -Iswarmeval/proto=proto --python_out=. --grpc_python_out=. --mypy_out=quiet:. --mypy_grpc_out=quiet:. $(find proto -name '*.proto' -not -path 'proto/swarmeval/api/*' -not -path 'proto/swarmeval/intake/*')",
]

[tasks."proto:lint"]
description = "buf lint, buf format, and a check that generated stubs match proto/"
run = [
  "buf lint",
  "buf format --diff --exit-code",
  "tmp=$(mktemp -d) && buf generate -o \"$tmp\" && diff -r \"$tmp/go/internal/gen\" go/internal/gen && rm -rf \"$tmp\"",
  "tmp=$(mktemp -d) && uv run python -m grpc_tools.protoc -Iswarmeval/proto=proto --python_out=\"$tmp\" --grpc_python_out=\"$tmp\" --mypy_out=quiet:\"$tmp\" --mypy_grpc_out=quiet:\"$tmp\" $(find proto -name '*.proto' -not -path 'proto/swarmeval/api/*' -not -path 'proto/swarmeval/intake/*') && diff -r -x __pycache__ \"$tmp/swarmeval/proto\" swarmeval/proto && rm -rf \"$tmp\"",
]

[tasks."proto:lint:console"]
description = "A check that the console's generated client matches proto/"
depends = ["console:install"]
run = "tmp=$(mktemp -d) && sed \"s|out: console/src/gen|out: $tmp|\" console/buf.gen.yaml > \"$tmp.yaml\" && buf generate --template \"$tmp.yaml\" --path proto/swarmeval/api --path proto/swarmeval/intake && diff -r \"$tmp\" console/src/gen && rm -rf \"$tmp\" \"$tmp.yaml\""

[tasks."proto:lint:intake"]
description = "A check that the intake Worker's generated code matches proto/"
depends = ["intake:install"]
run = "tmp=$(mktemp -d) && sed \"s|out: intake/src/gen|out: $tmp|\" intake/buf.gen.yaml > \"$tmp.yaml\" && buf generate --template \"$tmp.yaml\" --path proto/swarmeval/intake && diff -r \"$tmp\" intake/src/gen && rm -rf \"$tmp\" \"$tmp.yaml\""

[tasks."proto:breaking"]
description = "buf breaking against the local main branch. Only the public APIs (proto/swarmeval/api, proto/swarmeval/intake) are checked"
run = "buf breaking --against '.git#branch=main'"

[tasks.check]
description = "Everything that must pass before a change is done"
depends = ["lint", "typecheck", "test", "go:lint", "go:test", "proto:lint", "proto:lint:console", "proto:lint:intake", "proto:breaking", "console:check", "intake:check"]
