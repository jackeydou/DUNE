[tools]
uv = "0.10.5"
go = "1.27.1"
golangci-lint = "2.14.0"
buf = "1.73.0"
protoc-gen-go = "1.36.12"
protoc-gen-go-grpc = "1.6.2"

[tasks.sync]
description = "Install the Python version and all dependencies from uv.lock"
run = "uv sync --locked"

[tasks.fmt]
description = "Format all Python, Go, and proto files in place"
run = ["uv run ruff format .", "cd go && golangci-lint fmt ./...", "buf format -w"]

[tasks.lint]
description = "Check formatting and lint rules"
run = ["uv run ruff format --check .", "uv run ruff check ."]

[tasks.typecheck]
description = "Run pyright in strict mode"
run = "uv run pyright"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks."test:docker"]
description = "Python tests that start containers (Postgres via testcontainers). Needs docker"
run = "uv run pytest -m docker"

[tasks."go:lint"]
description = "golangci-lint over the Go module, integration tests included"
dir = "go"
run = "golangci-lint run ./..."

[tasks."go:test"]
description = "Go unit tests"
dir = "go"
run = "go test ./..."

[tasks."go:test-integration"]
description = "sandboxd against the local docker daemon. Needs busybox:latest and python:3.12-slim on the host"
dir = "go"
run = "go test -tags integration -count=1 ./..."

[tasks."proto:gen"]
description = "Generate gRPC stubs from proto/: Go with buf, Python with grpcio-tools"
run = [
  "buf generate",
  "rm -rf swarmeval/proto && uv run python -m grpc_tools.protoc -Iswarmeval/proto=proto --python_out=. --grpc_python_out=. --mypy_out=quiet:. --mypy_grpc_out=quiet:. $(find proto -name '*.proto')",
]

[tasks."proto:lint"]
description = "buf lint, buf format, and a check that generated stubs match proto/"
run = [
  "buf lint",
  "buf format --diff --exit-code",
  "tmp=$(mktemp -d) && buf generate -o \"$tmp\" && diff -r \"$tmp/go/internal/gen\" go/internal/gen && rm -rf \"$tmp\"",
  "tmp=$(mktemp -d) && uv run python -m grpc_tools.protoc -Iswarmeval/proto=proto --python_out=\"$tmp\" --grpc_python_out=\"$tmp\" --mypy_out=quiet:\"$tmp\" --mypy_grpc_out=quiet:\"$tmp\" $(find proto -name '*.proto') && diff -r -x __pycache__ \"$tmp/swarmeval/proto\" swarmeval/proto && rm -rf \"$tmp\"",
]

[tasks.check]
description = "Everything that must pass before a change is done"
depends = ["lint", "typecheck", "test", "go:lint", "go:test", "proto:lint"]
