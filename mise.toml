[tools]
uv = "0.10.5"
go = "1.27.1"
golangci-lint = "2.14.0"
buf = "1.73.0"
node = "24"
pnpm = "11.24.0"
protoc-gen-go = "1.36.12"
protoc-gen-go-grpc = "1.6.2"
"go:connectrpc.com/connect/cmd/protoc-gen-connect-go" = "1.21.0"

[tasks.sync]
description = "Install the Python version and all dependencies from uv.lock"
run = "uv sync --locked"

[tasks.fmt]
description = "Format all Python, Go, and proto files in place"
run = ["uv run ruff format .", "cd go && golangci-lint fmt ./...", "buf format -w"]

[tasks.lint]
description = "Check formatting and lint rules"
run = ["uv run ruff format --check .", "uv run ruff check ."]

[tasks.typecheck]
description = "Run pyright in strict mode"
run = "uv run pyright"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks."test:docker"]
description = "Python tests that start containers (Postgres via testcontainers). Needs docker"
run = "uv run pytest -m docker"

[tasks."go:lint"]
description = "golangci-lint over the Go module, integration tests included"
dir = "go"
run = "golangci-lint run ./..."

[tasks."go:test"]
description = "Go unit tests"
dir = "go"
run = "go test ./..."

[tasks."go:test-integration"]
description = "sandboxd against the local docker daemon (needs busybox:latest and python:3.12-slim on the host), and edge against a throwaway Postgres"
dir = "go"
run = "go test -tags integration -count=1 ./..."

[tasks."display:build"]
description = "Build swarmeval/display:dev, the sandbox image for the browser and computer tools. Downloads Debian packages and Chromium"
run = "docker build -f deploy/images/display/Dockerfile -t swarmeval/display:dev deploy/images/display"

[tasks."deploy:smoke"]
description = "The compose stack with a recorded model backend: a case created, run, and read through the CLI and the API. Needs docker"
run = "deploy/compose/smoke.sh"

[tasks."console:install"]
description = "Install the console's dependencies from pnpm-lock.yaml"
dir = "console"
run = "pnpm install --frozen-lockfile"

[tasks."console:check"]
description = "The console's typecheck, lint, and unit tests"
dir = "console"
depends = ["console:install"]
run = ["pnpm typecheck", "pnpm lint", "pnpm test"]

[tasks."console:build"]
description = "Build the console into go/internal/edge/webui/static, where edge embeds it from. Build edge after it"
dir = "console"
depends = ["console:install"]
run = "pnpm build"

[tasks."console:e2e"]
description = "Playwright walks the console's threshold flow against a local stack. Needs docker and a Chromium (Playwright's own, or PLAYWRIGHT_CHROMIUM)"
depends = ["console:install"]
run = "uv run pytest -m browser"

[tasks."proto:gen"]
description = "Generate gRPC stubs from proto/: Go with buf, Python with grpcio-tools, the console's client with protoc-gen-es"
depends = ["console:install"]
run = [
  "buf generate",
  "buf generate --template console/buf.gen.yaml --path proto/swarmeval/api",
  "rm -rf swarmeval/proto && uv run python -m grpc_tools.protoc -Iswarmeval/proto=proto --python_out=. --grpc_python_out=. --mypy_out=quiet:. --mypy_grpc_out=quiet:. $(find proto -name '*.proto' -not -path 'proto/swarmeval/api/*')",
]

[tasks."proto:lint"]
description = "buf lint, buf format, and a check that generated stubs match proto/"
run = [
  "buf lint",
  "buf format --diff --exit-code",
  "tmp=$(mktemp -d) && buf generate -o \"$tmp\" && diff -r \"$tmp/go/internal/gen\" go/internal/gen && rm -rf \"$tmp\"",
  "tmp=$(mktemp -d) && uv run python -m grpc_tools.protoc -Iswarmeval/proto=proto --python_out=\"$tmp\" --grpc_python_out=\"$tmp\" --mypy_out=quiet:\"$tmp\" --mypy_grpc_out=quiet:\"$tmp\" $(find proto -name '*.proto' -not -path 'proto/swarmeval/api/*') && diff -r -x __pycache__ \"$tmp/swarmeval/proto\" swarmeval/proto && rm -rf \"$tmp\"",
]

[tasks."proto:lint:console"]
description = "A check that the console's generated client matches proto/"
depends = ["console:install"]
run = "tmp=$(mktemp -d) && sed \"s|out: console/src/gen|out: $tmp|\" console/buf.gen.yaml > \"$tmp.yaml\" && buf generate --template \"$tmp.yaml\" --path proto/swarmeval/api && diff -r \"$tmp\" console/src/gen && rm -rf \"$tmp\" \"$tmp.yaml\""

[tasks."proto:breaking"]
description = "buf breaking against the local main branch. Only the public API (proto/swarmeval/api) is checked"
run = "buf breaking --against '.git#branch=main'"

[tasks.check]
description = "Everything that must pass before a change is done"
depends = ["lint", "typecheck", "test", "go:lint", "go:test", "proto:lint", "proto:lint:console", "proto:breaking", "console:check"]
