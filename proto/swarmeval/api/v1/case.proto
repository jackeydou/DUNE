syntax = "proto3";

package swarmeval.api.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/jackeydou/DUNE/go/internal/gen/swarmeval/api/v1;apiv1";

// CaseService is the case library: every case the platform has run or stored, with its
// revisions. A case is `workspace` and `case_id`, as its `case.yaml` names them. Revisions are
// numbered from 1 and never change; a run names the one it used. edge forwards each call to the
// orchestrator's Control API and records the caller on each revision. Case format:
// docs/case-format.md.
service CaseService {
  // Validates a case bundle and stores it as the newest revision of the case its `case.yaml`
  // names, creating the case on its first push. A bundle with the same bytes as the newest
  // revision makes no new one. A case that does not load is INVALID_ARGUMENT, with the loader's
  // message, and nothing is stored; an archived case is FAILED_PRECONDITION.
  rpc PushCase(PushCaseRequest) returns (PushCaseResponse);
  // Applies file changes to revision `base_revision` and stores the result as the next
  // revision, validated as PushCase validates. ABORTED when `base_revision` is no longer the
  // newest revision, because someone else changed the case; the message names the newest.
  // `base_revision` 0 creates the case from the written files alone.
  rpc UpdateCaseFiles(UpdateCaseFilesRequest) returns (UpdateCaseFilesResponse);
  // An unknown case is NOT_FOUND.
  rpc GetCase(GetCaseRequest) returns (GetCaseResponse);
  // By workspace, then case id.
  rpc ListCases(ListCasesRequest) returns (ListCasesResponse);
  // Newest first.
  rpc ListCaseRevisions(ListCaseRevisionsRequest) returns (ListCaseRevisionsResponse);
  // One revision with its files. An unknown case or revision is NOT_FOUND.
  rpc GetCaseRevision(GetCaseRevisionRequest) returns (GetCaseRevisionResponse);
  // An archived case is left out of ListCases by default and takes no pushes, edits, or runs.
  // Its revisions stay, because runs reference them.
  rpc ArchiveCase(ArchiveCaseRequest) returns (ArchiveCaseResponse);
  rpc UnarchiveCase(UnarchiveCaseRequest) returns (UnarchiveCaseResponse);
}

message Case {
  string workspace = 1;
  string case_id = 2;
  google.protobuf.Timestamp created_at = 3;
  // Unset while the case is not archived.
  google.protobuf.Timestamp archived_at = 4;
  // The newest revision.
  CaseRevision latest = 5;
}

message CaseRevision {
  string workspace = 1;
  string case_id = 2;
  int32 revision = 3;
  // sha256 of the revision's bundle; runs carry it as `case_sha256`.
  string bundle_sha256 = 4;
  // Who made the revision. Empty for one made without edge.
  string created_by = 5;
  string note = 6;
  google.protobuf.Timestamp created_at = 7;
}

// A regular file or a symbolic link of a case.
message CaseFile {
  // Relative to the case directory, with `/` separators.
  string path = 1;
  bytes content = 2;
  // Unix permission bits.
  uint32 mode = 3;
  // For a symbolic link, where it points; `content` is empty.
  string link_target = 4;
}

message PushCaseRequest {
  // The case directory as an uncompressed tar archive, with `case.yaml` at its root. At most
  // 64 MiB.
  bytes case_bundle = 1;
  // What changed, for the revision list. At most 1,000 characters.
  string note = 2;
}

message PushCaseResponse {
  CaseRevision revision = 1;
  // False when the bundle was the newest revision already.
  bool created = 2;
}

message FileChange {
  // Relative to the case directory, with `/` separators and no `..`.
  string path = 1;
  oneof change {
    // The file's new content, at most 1 MiB. Creates the file, with mode 0644, if it is new.
    bytes content = 2;
    // Removes the file. Must be true.
    bool delete = 3;
  }
}

message UpdateCaseFilesRequest {
  string workspace = 1;
  string case_id = 2;
  // The revision the changes were made against. Zero for a case that does not exist yet.
  int32 base_revision = 3;
  repeated FileChange changes = 4;
  string note = 5;
}

message UpdateCaseFilesResponse {
  CaseRevision revision = 1;
  // False when the changes left every file as it was.
  bool created = 2;
}

message GetCaseRequest {
  string workspace = 1;
  string case_id = 2;
}

message GetCaseResponse {
  Case case = 1;
}

message ListCasesRequest {
  // Empty for every workspace.
  string workspace = 1;
  bool include_archived = 2;
}

message ListCasesResponse {
  repeated Case cases = 1;
}

message ListCaseRevisionsRequest {
  string workspace = 1;
  string case_id = 2;
}

message ListCaseRevisionsResponse {
  repeated CaseRevision revisions = 1;
}

message GetCaseRevisionRequest {
  string workspace = 1;
  string case_id = 2;
  // Zero means the newest.
  int32 revision = 3;
}

message GetCaseRevisionResponse {
  CaseRevision revision = 1;
  // By path.
  repeated CaseFile files = 2;
  // The case's model slots, in the order its agents first name them: what a submission chooses
  // models for. Empty when the revision does not load, as `load_error` says.
  repeated string model_slots = 3;
  // Why the revision does not load in this SwarmEval, such as a `case.yaml` of a retired schema
  // version; it cannot run. Empty when it loads.
  string load_error = 4;
}

message ArchiveCaseRequest {
  string workspace = 1;
  string case_id = 2;
}

message ArchiveCaseResponse {
  Case case = 1;
}

message UnarchiveCaseRequest {
  string workspace = 1;
  string case_id = 2;
}

message UnarchiveCaseResponse {
  Case case = 1;
}
