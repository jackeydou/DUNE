syntax = "proto3";

package swarmeval.control.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jackeydou/DUNE/go/internal/gen/swarmeval/control/v1;controlv1";

// ControlService is the orchestrator control plane's API. Until edge exists (M4) it is bound to
// the internal network and has no authentication. Behavior: docs/services/orchestrator.md.
service ControlService {
  // Queues one run per variant and epoch of a case: a bundle, pushed to the case library as
  // PushCase pushes it, or a revision already there. A case that does not load is
  // INVALID_ARGUMENT, with the loader's message; an unknown case or revision is NOT_FOUND; an
  // archived case is FAILED_PRECONDITION.
  rpc SubmitRuns(SubmitRunsRequest) returns (SubmitRunsResponse);
  // Loads a suite with the case bundles it names and queues every case's runs in one
  // transaction, each case its own submission under one suite label: a suite with a case that
  // does not load queues nothing. The format: docs/case-format.md#suites. INVALID_ARGUMENT names
  // the suite entry at fault.
  rpc SubmitSuite(SubmitSuiteRequest) returns (SubmitSuiteResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  // Newest first.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  // A queued run never starts; a running one stops at its owner's next step, keeps its events,
  // and is not scored. Cancelling a finished run is FAILED_PRECONDITION.
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  // A run paused for a person (a Monitor's `pause`) goes on from where it stopped. A run that is
  // not paused is FAILED_PRECONDITION.
  rpc ResumeRun(ResumeRunRequest) returns (ResumeRunResponse);
  // A new run that goes on from a finished run's state at the start of the turn `at_event_id`
  // happened in, with `edits` applied: the same case
  // revision, variant, and seed, its sandboxes restored from the stored file contents. Not an
  // epoch: reports keep forks apart. An unknown run or event is NOT_FOUND; a run still going, an
  // event before the first turn, or an edit that does not fit the state there is
  // FAILED_PRECONDITION.
  rpc ForkRun(ForkRunRequest) returns (ForkRunResponse);
  // A run's events with seq greater than `after_seq`, live while the run is going. The stream
  // ends once the run has finished and every event was sent.
  rpc StreamEvents(StreamEventsRequest) returns (stream StreamEventsResponse);
  // The model names runs may use: what model-gateway serves. UNAVAILABLE when model-gateway
  // cannot be reached.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);

  // The case library (docs/services/orchestrator.md#case-library). A case is `workspace` and
  // `case_id`, as its `case.yaml` names them; its revisions are numbered from 1 and never change.

  // Validates a case bundle and stores it as the newest revision of the case its `case.yaml`
  // names, creating the case on its first push. A bundle with the same bytes as the newest
  // revision makes no new one. A case that does not load is INVALID_ARGUMENT and nothing is
  // stored; an archived case is FAILED_PRECONDITION.
  rpc PushCase(PushCaseRequest) returns (PushCaseResponse);
  // Applies file changes to revision `base_revision` and stores the result as the next
  // revision, validated as PushCase validates. ABORTED when `base_revision` is not the newest
  // revision; the message names the newest. `base_revision` 0 creates the case from the written
  // files alone.
  rpc UpdateCaseFiles(UpdateCaseFilesRequest) returns (UpdateCaseFilesResponse);
  rpc GetCase(GetCaseRequest) returns (GetCaseResponse);
  // By workspace, then case id.
  rpc ListCases(ListCasesRequest) returns (ListCasesResponse);
  // Newest first.
  rpc ListCaseRevisions(ListCaseRevisionsRequest) returns (ListCaseRevisionsResponse);
  // One revision with its files.
  rpc GetCaseRevision(GetCaseRevisionRequest) returns (GetCaseRevisionResponse);
  // An archived case is left out of ListCases by default and takes no pushes, edits, or runs.
  // Its revisions and bundles stay: runs reference them.
  rpc ArchiveCase(ArchiveCaseRequest) returns (ArchiveCaseResponse);
  rpc UnarchiveCase(UnarchiveCaseRequest) returns (UnarchiveCaseResponse);
}

message SubmitRunsRequest {
  // The case directory as an uncompressed tar archive, with `case.yaml` at its root. Set this
  // or `case`, not both.
  bytes case_bundle = 1;
  // A revision in the case library, instead of a bundle.
  CaseRevisionRef case = 6;
  // Variant axis → list of values, replacing that axis's values in the case.
  google.protobuf.Struct overrides = 2;
  // Runs per variant. Zero means the case's `epochs`.
  int32 epochs = 3;
  // Labels the submissions of one suite run, so a report can cover them together: lowercase
  // letters, digits, `_`, `.`, and `-`, starting with a letter or digit. Empty for none.
  string suite = 4;
  // Who asks, as edge authenticated them; empty for internal tooling. Recorded on the runs.
  string actor = 5;
  // Model slot → the models to run it on, for every slot of the case and no other. Each
  // slot's models are one more dimension of the run matrix. A name model-gateway does not serve
  // is INVALID_ARGUMENT; model-gateway out of reach is UNAVAILABLE.
  map<string, ModelChoice> models = 7;
}

message ModelChoice {
  repeated string names = 1;
}

// One revision of a case in the library.
message CaseRevisionRef {
  string workspace = 1;
  string case_id = 2;
  // Zero means the newest.
  int32 revision = 3;
}

message SubmitRunsResponse {
  string submission_id = 1;
  repeated string run_ids = 2;
  // The revision the runs use.
  int32 case_revision = 3;
}

message SubmitSuiteRequest {
  // The suite file as written.
  string suite_yaml = 1;
  // Each `cases[].path` of the suite, as written there, → that case directory as a tar
  // archive. A path the suite names more than once is sent once. The whole request is at most
  // 64 MiB.
  map<string, bytes> case_bundles = 2;
  string actor = 3;
}

message SuiteSubmission {
  string case_id = 1;
  string submission_id = 2;
  repeated string run_ids = 3;
  int32 case_revision = 4;
}

message SubmitSuiteResponse {
  // `<suite id>.<8 hex>`, for reports over the whole suite.
  string suite = 1;
  // One per suite entry, in the suite's order.
  repeated SuiteSubmission submissions = 2;
}

message Run {
  string run_id = 1;
  string submission_id = 2;
  string case_id = 3;
  string workspace = 4;
  // `queued`, `running`, `paused`, `interrupted`, `done`, `failed`, or `cancelled`.
  string status = 5;
  int32 variant = 6;
  // The variant's axis values.
  google.protobuf.Struct task_args = 7;
  int32 epoch = 8;
  int32 epochs = 9;
  string case_sha256 = 10;
  string owner_id = 11;
  // Container runtime the run's sandboxes got: `runc` or `runsc`. Empty until they exist.
  string isolation = 12;
  // Why the run failed or was interrupted.
  string error = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp started_at = 15;
  google.protobuf.Timestamp finished_at = 16;
  // The interrupted run this one reruns at a new epoch; empty for a run the submission asked for.
  string replaces = 17;
  // The suite label of the run's submission; empty for none.
  string suite = 18;
  // For a fork: the run it goes on from, and the last of that run's events it starts after.
  string forked_from = 19;
  int64 fork_seq = 20;
  // For a fork, once its sandboxes are restored: `fs_restored` when every recorded file change
  // up to the fork point was restored, `fs_partial` when some could not be.
  string fidelity = 21;
  // The actor of the submission or fork that queued the run; a rerun keeps its predecessor's.
  // Empty when the request named none.
  string submitted_by = 22;
  // The actor of the CancelRun that cancelled the run, and of the last ResumeRun.
  string cancelled_by = 23;
  string resumed_by = 24;
  // The case library revision the run uses; `case_sha256` is that revision's bundle.
  int32 case_revision = 25;
  // Times a worker claimed the run after its owner's lease ran out
  // (docs/services/orchestrator.md#leases-fencing-and-takeover).
  int32 takeovers = 26;
}

message GetRunRequest {
  string run_id = 1;
}

message GetRunResponse {
  Run run = 1;
}

message ListRunsRequest {
  // Filters; empty matches everything.
  string submission_id = 1;
  string case_id = 2;
  string status = 3;
  string suite = 5;
  string workspace = 6;
  // Zero means 100.
  int32 limit = 4;
}

message ListRunsResponse {
  repeated Run runs = 1;
}

message CancelRunRequest {
  string run_id = 1;
  string actor = 2;
}

message CancelRunResponse {
  Run run = 1;
}

message ResumeRunRequest {
  string run_id = 1;
  string actor = 2;
}

message ResumeRunResponse {
  Run run = 1;
}

message ForkRunRequest {
  string run_id = 1;
  string at_event_id = 2;
  repeated ForkEdit edits = 3;
  string actor = 4;
}

message ForkEdit {
  oneof edit {
    ReplaceMessage replace_message = 1;
    DeleteMessage delete_message = 2;
    ReplaceDelivery replace_delivery = 3;
    ReplaceModel replace_model = 4;
  }
}

// Runs the agents of model slot `slot` on `model` from the fork point. The fork's `task_args`
// name the new model.
message ReplaceModel {
  string slot = 1;
  string model = 2;
}

// The text of message `index` in an agent's context at the fork point.
message ReplaceMessage {
  string agent_id = 1;
  int32 index = 2;
  string content = 3;
}

// A user message (a delivery or an injection) in an agent's context at the fork point.
message DeleteMessage {
  string agent_id = 1;
  int32 index = 2;
}

// Other content for a message routed to `recipient` but not yet delivered at the fork point.
message ReplaceDelivery {
  string send_event_id = 1;
  string recipient = 2;
  string content = 3;
}

message ForkRunResponse {
  Run run = 1;
}

message StreamEventsRequest {
  string run_id = 1;
  int64 after_seq = 2;
}

message StreamEventsResponse {
  int64 seq = 1;
  string event_id = 2;
  // The Inspect event type, or an InfoEvent's `swarmeval.<kind>` source.
  string type = 3;
  string agent_id = 4;
  // The stored Inspect event, as JSON.
  string payload_json = 5;
  // The event on one line, as the judge and the timeline show it (swarmeval.events.render),
  // cut at 2,000 characters.
  string line = 6;
}

message Case {
  string workspace = 1;
  string case_id = 2;
  google.protobuf.Timestamp created_at = 3;
  // Unset while the case is not archived.
  google.protobuf.Timestamp archived_at = 4;
  // The newest revision.
  CaseRevision latest = 5;
}

message CaseRevision {
  string workspace = 1;
  string case_id = 2;
  int32 revision = 3;
  string bundle_sha256 = 4;
  // The actor of the request that made the revision; empty when it named none.
  string actor = 5;
  string note = 6;
  google.protobuf.Timestamp created_at = 7;
}

// A regular file or a symbolic link of a case bundle.
message CaseFile {
  // Relative to the case directory, with `/` separators.
  string path = 1;
  bytes content = 2;
  // Unix permission bits.
  uint32 mode = 3;
  // For a symbolic link, where it points; `content` is empty.
  string link_target = 4;
}

message PushCaseRequest {
  bytes case_bundle = 1;
  string actor = 2;
  // What changed, for the revision list. At most 1,000 characters.
  string note = 3;
}

message PushCaseResponse {
  CaseRevision revision = 1;
  // False when the bundle was the newest revision already.
  bool created = 2;
}

message FileChange {
  // Relative to the case directory, with `/` separators and no `..`.
  string path = 1;
  oneof change {
    // The file's new content, at most 1 MiB. Creates the file, with mode 0644, if it is new.
    bytes content = 2;
    // Removes the file. Must be true.
    bool delete = 3;
  }
}

message UpdateCaseFilesRequest {
  string workspace = 1;
  string case_id = 2;
  // The revision the changes were made against. Zero for a case that does not exist yet.
  int32 base_revision = 3;
  repeated FileChange changes = 4;
  string actor = 5;
  string note = 6;
}

message UpdateCaseFilesResponse {
  CaseRevision revision = 1;
  // False when the changes left every file as it was.
  bool created = 2;
}

message GetCaseRequest {
  string workspace = 1;
  string case_id = 2;
}

message GetCaseResponse {
  Case case = 1;
}

message ListCasesRequest {
  // Empty for every workspace.
  string workspace = 1;
  bool include_archived = 2;
}

message ListCasesResponse {
  repeated Case cases = 1;
}

message ListCaseRevisionsRequest {
  string workspace = 1;
  string case_id = 2;
}

message ListCaseRevisionsResponse {
  repeated CaseRevision revisions = 1;
}

message GetCaseRevisionRequest {
  string workspace = 1;
  string case_id = 2;
  // Zero means the newest.
  int32 revision = 3;
}

message GetCaseRevisionResponse {
  CaseRevision revision = 1;
  // By path.
  repeated CaseFile files = 2;
  // The case's model slots, in the order its agents first name them: what a submission chooses
  // models for. Empty when the revision does not load, as `load_error` says.
  repeated string model_slots = 3;
  // Why the revision does not load in this SwarmEval, such as a `case.yaml` of a retired schema
  // version; it cannot run. Empty when it loads.
  string load_error = 4;
}

message ArchiveCaseRequest {
  string workspace = 1;
  string case_id = 2;
  string actor = 3;
}

message ArchiveCaseResponse {
  Case case = 1;
}

message UnarchiveCaseRequest {
  string workspace = 1;
  string case_id = 2;
  string actor = 3;
}

message UnarchiveCaseResponse {
  Case case = 1;
}

message ListModelsRequest {}

message ListModelsResponse {
  // Sorted.
  repeated string models = 1;
}
